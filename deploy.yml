name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pasang nomor versi baru (memicu update otomatis di HP)
        run: |
          VERSION="$(TZ=Asia/Jakarta date +'%Y.%m.%d-%H%M')-${GITHUB_SHA::7}"
          echo "Versi: $VERSION"
          sed -i "s/__APP_VERSION__/$VERSION/g" sw.js app.js
          mkdir -p _site
          cp -r index.html app.js income.js sync.js sw.js manifest.json jspdf.umd.min.js icon.svg icon-192.png icon-512.png fonts _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
